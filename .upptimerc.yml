owner: MAMubeenKhan
repo: screenshotline-status

# Checked every 5 minutes from GitHub's servers - not from ours, so this page
# stays up and truthful when the Screenshotline box is down.
sites:
  - name: Website
    url: https://screenshotline.com
  # A real capture, not a ping: /healthz/render renders example.com through
  # the production pool (at most once a minute, cached for everyone else).
  # A green here means screenshots are actually being taken.
  - name: Screenshot rendering
    url: https://screenshotline.com/healthz/render
    maxResponseTime: 30000
  # 401 is the healthy answer: the API is up and refusing a request with no
  # key, without spending a render on the check.
  - name: API
    url: https://api.screenshotline.com/take?url=example.com
    expectedStatusCodes:
      - 401
  # 405 is the healthy answer: the MCP endpoint is up and only accepts POST.
  - name: MCP server
    url: https://api.screenshotline.com/mcp
    expectedStatusCodes:
      - 405

assignees:
  - MAMubeenKhan

status-website:
  cname: status.screenshotline.com
  logoUrl: https://raw.githubusercontent.com/MAMubeenKhan/screenshotline-status/master/assets/screenshotline.svg
  name: Screenshotline Status
  introTitle: "**Screenshotline** - live status"
  introMessage: Checked every five minutes from GitHub's servers, not ours. **Screenshot rendering** takes a real capture; the others confirm each service is answering. [Back to screenshotline.com](https://screenshotline.com/?ref=status)
  navbar:
    - title: Status
      href: /
    - title: screenshotline.com
      href: https://screenshotline.com/?ref=status
    - title: Docs
      href: https://screenshotline.com/docs?ref=status
